---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata: { name: cleanup }
spec:
  description: Clean up the workspace by deleting all files from WORKSPACE_SOURCE_PATH.
  workspaces: [{ name: source }]
  steps:
    - name: remove
      image: alpine:3
      env: [{ name: WORKSPACE_SOURCE_PATH, value: $(workspaces.source.path) }]
      securityContext: { runAsNonRoot: false, runAsUser: 0 }
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from ${WORKSPACE_SOURCE_PATH} ..."
        rm -rf "${WORKSPACE_SOURCE_PATH:?}"/* "${WORKSPACE_SOURCE_PATH}"/.[!.]* "${WORKSPACE_SOURCE_PATH}"/..?*
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata: { name: jest-test }
spec:
  workspaces: [{ name: source }]
  params: [{ name: args, type: string, default: "-v", description: Arguments to pass to jest }]
  steps:
    - name: jest
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npm ci
        npx jest $(params.args)
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata: { name: eslint }
spec:
  workspaces: [{ name: source }]
  params: [{ name: args, type: string, default: "src/ tests/ --ext .js", description: Arguments to pass to ESLint }]
  steps:
    - name: lint
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        npm ci
        npx eslint $(params.args)